name: "CodeQL Security Scanning"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 0"
  # Disabled automatic triggers - using build-deb workflow instead
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
